    <noscript>

    <script type="module" src="/src/main.tsx?v=5173"></script>
    <script>
      // Ultimate iPhone Safari favicon cache clearing
      ;(function () {
        // Force reload all favicon and icon links
        const iconSelectors = [
          "link[rel*='icon']",
          "link[rel*='apple-touch-icon']",
          "link[rel='shortcut icon']",
        ]

        iconSelectors.forEach(function (selector) {
          const links = document.querySelectorAll(selector)
          links.forEach(function (link) {
            // Remove and recreate the link element with fresh timestamp
            const newLink = link.cloneNode(true)
            const baseHref = link.href.split('?')[0]
            newLink.href = baseHref + '?v=dolonia-favicon-' + Date.now()
            link.parentNode.removeChild(link)
            document.head.appendChild(newLink)
          })
        })

        // Force favicon refresh for all browsers
        if (typeof window !== 'undefined') {
          // Create a new link element for favicon.ico specifically
          const faviconLink = document.createElement('link')
          faviconLink.rel = 'icon'
          faviconLink.type = 'image/x-icon'
          faviconLink.href = '/favicon.ico?v=dolonia-favicon-' + Date.now()
          document.head.appendChild(faviconLink)

          // iOS Safari specific refresh
          if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream) {
            // Force a hard refresh if coming from cache
            if (performance.navigation.type === 2) {
              location.reload(true)
            }

            // Additional iOS favicon refresh
            setTimeout(function () {
              const links = document.querySelectorAll("link[rel*='icon']")
              links.forEach(function (link) {
                link.href = link.href.split('?')[0] + '?v=dolonia-ios-' + Date.now()
              })
            }, 100)
          }
        }
      })()
    </script>

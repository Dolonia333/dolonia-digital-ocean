<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOLONIA DATA TECH - Health Check</title>
    <style>
      body {
        font-family: 'Courier New', monospace;
        background: #000;
        color: #00ff00;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .health-container {
        text-align: center;
        border: 1px solid #00ff00;
        padding: 20px;
        border-radius: 5px;
        background: rgba(0, 255, 0, 0.1);
      }
      .status {
        font-size: 2em;
        margin: 10px 0;
      }
      .healthy {
        color: #00ff00;
      }
      .timestamp {
        font-size: 0.8em;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="health-container">
      <h1>DOLONIA DATA TECH</h1>
      <div class="status healthy">✓ HEALTHY</div>
      <div class="timestamp">Last checked: <span id="timestamp"></span></div>
      <div>Service: Operational</div>
      <div>Version: 1.0.0</div>
    </div>

    <script>
      document.getElementById('timestamp').textContent = new Date().toISOString()
    </script>
  </body>
</html>
